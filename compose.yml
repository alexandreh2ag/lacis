services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lacis
      POSTGRES_PASSWORD: lacis
      POSTGRES_DB: lacis
    ports:
      # Reachable from this machine only: the credentials are those of development.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
