name: Docs version

# A version tag snapshots the documentation as it was at the tag into a
# Docusaurus version, commits it on main, then starts docs.yml on main to
# publish it. A push made with GITHUB_TOKEN starts no workflow, but a
# workflow_dispatch does: hence the explicit start.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docs-version
  cancel-in-progress: false

jobs:
  version:
    name: Version the documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: docs/.nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      # The documentation of the tag becomes the version; main keeps its own
      # afterwards (the next version).
      - name: Commit the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ -f versions.json ] && jq -e --arg v "$version" 'index($v) != null' versions.json >/dev/null; then
            echo "version $version already exists"
            exit 0
          fi
          git checkout "$TAG" -- docs sidebars.ts
          npm run docusaurus -- docs:version "$version"
          git checkout HEAD -- docs sidebars.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json versioned_docs versioned_sidebars
          git commit -s -m "Version the documentation $version"
          git push origin HEAD:main

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
