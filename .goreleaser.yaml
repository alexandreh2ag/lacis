# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: lacis

git:
  # The modules common/ and agent/ get their own tags (common/vX.Y.Z,
  # agent/vX.Y.Z) on the same commit: only vX.Y.Z names a release.
  ignore_tags:
    - "common/*"
    - "agent/*"

before:
  hooks:
    # lacis-server embeds web/dist.
    - sh -c "cd web && npm ci && npm run build"

builds:
  - id: lacis-server
    main: .
    binary: lacis-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/alexandreh2ag/lacis/common/version.Version={{ .Version }}
      - -X github.com/alexandreh2ag/lacis/common/version.Commit={{ .ShortCommit }}
      - -X github.com/alexandreh2ag/lacis/common/version.Date={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: lacis-agent
    dir: agent
    main: .
    binary: lacis-agent
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

# The bare binaries, without archive: nothing to extract.
archives:
  - id: lacis-server
    ids: [lacis-server]
    formats: [binary]
    name_template: "lacis-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: lacis-agent
    ids: [lacis-agent]
    formats: [binary]
    name_template: "lacis-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless signature of the checksums with cosign (GitHub OIDC identity):
# verify with cosign verify-blob --bundle checksums.txt.sigstore.json.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

# The server image, from the lacis-server binary built above (the front is
# already embedded): Dockerfile.release only copies it, so no emulation for
# arm64. X.Y and latest only name a final release.
dockers_v2:
  - id: lacis-server
    ids: [lacis-server]
    dockerfile: Dockerfile.release
    images:
      - ghcr.io/alexandreh2ag/lacis-server
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: lacis-server
      org.opencontainers.image.description: "Lacis server: infrastructure inventory and dependency graph"
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.url: https://github.com/alexandreh2ag/lacis
      org.opencontainers.image.source: https://github.com/alexandreh2ag/lacis
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"

# Keyless signature of the image (GitHub OIDC identity), by its digest:
# verify with cosign verify ghcr.io/alexandreh2ag/lacis-server:X.Y.Z.
# Without artifacts, docker_signs signs the images of dockers_v2.
docker_signs:
  - args:
      - sign
      - ${artifact}@${digest}
      - --yes
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
